spring:
  datasource:
    url: jdbc:mysql://localhost:3306/template_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&cachePrepStmts=true&useServerPrepStmts=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariCP-Pool
      leak-detection-threshold: 60000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-long-enough-for-hs256-algorithm}
  access-expire: 7200000
  refresh-expire: 604800000

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  cache:
    user-ttl: 30
    user-list-ttl: 5

logging:
  level:
    com.template: debug
