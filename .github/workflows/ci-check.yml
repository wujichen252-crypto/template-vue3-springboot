name: CI Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FRONTEND_DIR: ${{ vars.PROJECT_FRONTEND_DIR || './frontend' }}
  BACKEND_DIR: ${{ vars.PROJECT_BACKEND_DIR || './backend' }}
  JAVA_VER: ${{ vars.JAVA_VERSION || '17' }}
  NODE_VER: ${{ vars.NODE_VERSION || '20' }}
  BUILD_TOOL: ${{ vars.BUILD_TOOL || 'gradle' }}

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: 'pnpm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run lint
        run: pnpm run lint
      
      - name: Build frontend
        run: pnpm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      # 设置 JDK
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      # Gradle 缓存优化 - 使用官方 Gradle Action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      
      # 代码风格检查 (ktlint)
      - name: Run ktlint check
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true
      
      # 编译 + 测试
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon
      
      # 生成测试报告
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.BACKEND_DIR }}/build/reports/tests/
            ${{ env.BACKEND_DIR }}/build/reports/ktlint/
          retention-days: 7
      
      # 确认产物
      - name: List artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -la build/libs/*.jar || true
          echo "=== Build info ==="
          cat build/resources/main/META-INF/build-info.properties 2>/dev/null || true

  # 依赖安全扫描
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      # 检查依赖漏洞
      - name: Check dependencies
        run: ./gradlew dependencies --configuration runtimeClasspath --no-daemon
