name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  FRONTEND_DIR: ${{ vars.PROJECT_FRONTEND_DIR || './frontend' }}
  BACKEND_DIR: ${{ vars.PROJECT_BACKEND_DIR || './backend' }}
  NODE_VER: ${{ vars.NODE_VERSION || '20' }}
  JAVA_VER: ${{ vars.JAVA_VERSION || '17' }}
  BUILD_TOOL: ${{ vars.BUILD_TOOL || 'gradle' }}

jobs:
  # ==========================================
  # Job 1: 构建前端
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: 'pnpm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build frontend
        run: pnpm run build
      
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 3

  # ==========================================
  # Job 2: 构建后端 JAR (Gradle)
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      # Gradle 缓存优化
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      # 构建 JAR (包含测试)
      - name: Build JAR with Gradle
        run: ./gradlew clean bootJar --no-daemon
      
      # 统一产物名称
      - name: Prepare artifact
        run: |
          mkdir -p ../jars
          cp build/libs/*.jar ../jars/app.jar
          ls -la ../jars/
      
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./jars/app.jar
          retention-days: 3

  # ==========================================
  # Job 3: 部署
  # ==========================================
  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    
    # 防御性条件：关键变量未配置时直接跳过
    if: |
      vars.DEPLOY_SERVER_HOST != '' &&
      vars.DEPLOY_FRONTEND_PATH != '' &&
      vars.DEPLOY_BACKEND_PATH != '' &&
      secrets.SSH_PRIVATE_KEY != ''
    
    steps:
      # 下载前端产物
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist
      
      # 下载后端 JAR
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jars

      # 部署前端静态文件
      - name: Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_SERVER_HOST }}
          username: ${{ vars.DEPLOY_SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_SERVER_PORT || '22' }}
          source: "dist/*"
          target: ${{ vars.DEPLOY_FRONTEND_PATH }}
          strip_components: 1

      # 部署后端 JAR
      - name: Deploy Backend JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_SERVER_HOST }}
          username: ${{ vars.DEPLOY_SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_SERVER_PORT || '22' }}
          source: "jars/app.jar"
          target: ${{ vars.DEPLOY_BACKEND_PATH }}/

      # 服务器端替换、迁移、重启
      - name: Execute Backend Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_SERVER_HOST }}
          username: ${{ vars.DEPLOY_SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_SERVER_PORT || '22' }}
          script: |
            set -e
            
            BACKEND_PATH="${{ vars.DEPLOY_BACKEND_PATH }}"
            JAR_NAME="${{ vars.DEPLOY_JAR_NAME || 'app.jar' }}"
            SERVICE_NAME="${{ vars.DEPLOY_SERVICE_NAME || 'template-api' }}"
            APP_PORT="${{ vars.APP_PORT || '8080' }}"
            JAVA_OPTS="${{ vars.JAVA_OPTS || '-Xms256m -Xmx512m' }}"
            SPRING_PROFILE="${{ vars.SPRING_PROFILE || 'prod' }}"
            ENABLE_FLYWAY="${{ vars.ENABLE_FLYWAY || 'true' }}"
            RESTART_CMD="${{ vars.DEPLOY_RESTART_COMMAND || 'sudo systemctl restart template-api' }}"
            
            echo "===== 开始部署 Spring Boot 后端 ====="
            
            cd "$BACKEND_PATH"
            
            # 备份旧 JAR
            if [ -f "$JAR_NAME" ]; then
              BACKUP_NAME="${JAR_NAME}.bak.$(date +%Y%m%d_%H%M%S)"
              cp "$JAR_NAME" "$BACKUP_NAME"
              echo "已备份旧版本: $BACKUP_NAME"
            fi
            
            # 替换新 JAR
            if [ "$JAR_NAME" != "app.jar" ]; then
              mv app.jar "$JAR_NAME"
            fi
            
            # Flyway 迁移由 Spring Boot 启动时自动执行
            if [ "$ENABLE_FLYWAY" == "true" ]; then
              echo "Flyway 迁移由 Spring Boot 启动时自动执行"
            fi
            
            # 重启服务
            echo "重启服务: $SERVICE_NAME"
            eval "$RESTART_CMD"
            
            # 健康检查（Spring Boot Actuator）
            sleep 8
            HEALTH_URL="http://127.0.0.1:${APP_PORT}/actuator/health"
            echo "健康检查: $HEALTH_URL"
            
            if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
              echo "健康检查通过 ✅"
            else
              echo "健康检查未通过，等待 5 秒重试..."
              sleep 5
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "健康检查通过 ✅"
              else
                echo "健康检查失败 ❌，请手动检查日志: journalctl -u $SERVICE_NAME -n 50"
                exit 1
              fi
            fi
            
            echo "===== 后端部署完成 ====="

      # 部署通知
      - name: Notify
        if: vars.DEPLOY_NOTIFY_WEBHOOK != ''
        run: |
          curl -X POST ${{ vars.DEPLOY_NOTIFY_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"msg":"[Spring Boot] 部署成功: ${{ github.repository }}@${{ github.sha }}"}' || true
