name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一凌晨运行
    - cron: '0 0 * * 1'

env:
  BACKEND_DIR: ${{ vars.PROJECT_BACKEND_DIR || './backend' }}
  JAVA_VER: ${{ vars.JAVA_VERSION || '17' }}

jobs:
  # ==========================================
  # Kotlin 代码风格检查
  # ==========================================
  ktlint-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      - name: Run ktlint check
        run: ./gradlew ktlintCheck --no-daemon
      
      - name: Upload ktlint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: ${{ env.BACKEND_DIR }}/build/reports/ktlint/
          retention-days: 7

  # ==========================================
  # 依赖安全扫描
  # ==========================================
  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      # 使用 Gradle OWASP 依赖检查插件
      - name: Run OWASP dependency check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
      
      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ env.BACKEND_DIR }}/build/reports/dependency-check-report.html
          retention-days: 7

  # ==========================================
  # 测试覆盖率检查
  # ==========================================
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport --no-daemon
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.BACKEND_DIR }}/build/reports/jacoco/
          retention-days: 7
      
      # 可选：上传到 Codecov
      - name: Upload to Codecov
        if: vars.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.BACKEND_DIR }}/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          token: ${{ vars.CODECOV_TOKEN }}

  # ==========================================
  # SonarQube 代码分析
  # ==========================================
  sonarqube-analysis:
    runs-on: ubuntu-latest
    if: vars.SONAR_TOKEN != ''
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VER }}
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      
      - name: Run SonarQube analysis
        run: ./gradlew sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
