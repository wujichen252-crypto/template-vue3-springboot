spring:
  datasource:
    url: jdbc:mysql://localhost:3306/template_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariCP-Pool
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

jwt:
  secret: your-256-bit-secret-key-here-must-be-long-enough-for-hs256-algorithm
  access-expire: 7200000
  refresh-expire: 604800000

logging:
  level:
    com.template: debug
